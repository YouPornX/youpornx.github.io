    .msg-form {

    .send-btn {

    /* Contador de online */

import { initializeApp }              from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getDatabase, ref, onValue, set, onDisconnect, serverTimestamp as rtServerTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ── Configuración Firebase ── */
const firebaseConfig = {
  apiKey:            "AIzaSyB1k3rqLSx2Pqa0C4v23oq3Nl5Q3gyJr38",
  authDomain:        "comunidad-19e14.firebaseapp.com",
  projectId:         "comunidad-19e14",
  storageBucket:     "comunidad-19e14.firebasestorage.app",
  messagingSenderId: "291432228524",
  appId:             "1:291432228524:web:287ba27110e033e5b7e109",
  databaseURL:       "https://comunidad-19e14-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let userId    = localStorage.getItem('ypx_uid')   || crypto.randomUUID();
let isAdmin   = localStorage.getItem('ypx_admin') === '1';
localStorage.setItem('ypx_uid', userId);

/* ── Elementos DOM ── */
const nameOverlay  = document.getElementById('nameOverlay');
const nameInput    = document.getElementById('nameInput');
const passInput    = document.getElementById('passInput');
const passWrap     = document.getElementById('passWrap');
const nameBtn      = document.getElementById('nameBtn');
const displayName  = document.getElementById('displayName');
const changeNameBtn= document.getElementById('changeNameBtn');
const wallMessages = document.getElementById('wallMessages');
const emptyState   = document.getElementById('emptyState');
const msgInput     = document.getElementById('msgInput');
const sendBtn      = document.getElementById('sendBtn');
const onlineCount  = document.getElementById('onlineCount');

nameInput.addEventListener('input', () => {
  passWrap.style.display = nameInput.value.trim().toLowerCase() === 'you' ? 'block' : 'none';
});

/* ── Inicializar ── */
function iniciar() {
  if (userName) {
    nameOverlay.style.display = 'none';
    displayName.textContent   = userName + (isAdmin ? ' 👑' : '');
    sendBtn.disabled          = false;
    escucharMensajes();
  } else {
    nameOverlay.style.display = 'flex';
    nameInput.focus();
  }
}

/* ── Guardar nombre ── */
function guardarNombre() {
  const n = nameInput.value.trim();
  if (!n) return;
  userName = n.substring(0, 20);

  // Verificar si es admin
  if (n.toLowerCase() === 'you' && passInput.value === _ak) {
    isAdmin = true;
    localStorage.setItem('ypx_admin', '1');
  } else {
    isAdmin = false;
    localStorage.removeItem('ypx_admin');
  }

  localStorage.setItem('ypx_name', userName);
  nameOverlay.style.display = 'none';
  displayName.textContent   = userName + (isAdmin ? ' 👑' : '');
  sendBtn.disabled          = false;
  escucharMensajes();
}

nameBtn.addEventListener('click', guardarNombre);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') guardarNombre(); });
passInput.addEventListener('keydown', e => { if (e.key === 'Enter') guardarNombre(); });
changeNameBtn.addEventListener('click', () => {
  nameInput.value = userName || '';
  nameOverlay.style.display = 'flex';
  nameInput.focus();
});

/* ── Escuchar mensajes en tiempo real ── */
function escucharMensajes() {
  const q = query(
    collection(db, 'mensajes'),
    orderBy('createdAt', 'asc'),
    limit(100)
  );

  onSnapshot(q, snapshot => {
    const msgs = [];
    snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));

    if (msgs.length === 0) {
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    // Solo renderizar mensajes nuevos
    const rendered = new Set([...wallMessages.querySelectorAll('.msg')].map(el => el.dataset.id));
    msgs.forEach(msg => {
      if (rendered.has(msg.id)) return;
      renderMsg(msg);
    });

    // Scroll al último mensaje
    wallMessages.scrollTop = wallMessages.scrollHeight;
  });
}

/* ── Renderizar un mensaje ── */

  const esPropio = msg.userId === userId;
  const inicial  = (msg.nombre || '?')[0].toUpperCase();
  const hora     = msg.createdAt?.toDate
    ? msg.createdAt.toDate().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })
    : '';

  const esAdmin  = msg.isAdmin === true;
  const badge    = esAdmin ? '<span class="admin-badge">👑 Admin</span>' : '';

  const div = document.createElement('div');
  div.className  = 'msg' + (esPropio ? ' own' : '') + (esAdmin ? ' admin' : '');
  div.dataset.id = msg.id;

  div.innerHTML = `
    <div class="msg-avatar" style="${esAdmin ? 'background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 0 12px var(--accent-glow)' : ''}">${inicial}</div>
    <div class="msg-body">
      <div class="msg-meta">
        <span class="msg-name">${escapeHtml(msg.nombre)}${badge}</span>
        <span class="msg-time">${hora}</span>
      </div>
      <div class="msg-bubble">${escapeHtml(msg.texto)}</div>
    </div>`;

  wallMessages.appendChild(div);
}

  if (!texto || !userName) return;

  sendBtn.disabled  = true;
  msgInput.value    = '';
  msgInput.style.height = 'auto';

  try {
    await addDoc(collection(db, 'mensajes'), {
      nombre:    userName,
      userId:    userId,
      texto:     texto,
      isAdmin:   isAdmin,
      createdAt: serverTimestamp()
    });
  } catch (e) {
    console.error('Error enviando:', e);
    msgInput.value = texto; // restaurar si falló
  } finally {
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

sendBtn.addEventListener('click', enviarMensaje);
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    enviarMensaje();
  }
});

/* Auto-resize del textarea */
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});

/* ── Contador de usuarios online (Realtime Database) ── */
try {
  const rtdb      = getDatabase(app);
  const presRef   = ref(rtdb, `presencia/${userId}`);
  const countRef  = ref(rtdb, 'presencia');

  set(presRef, { online: true, name: userName || 'Anónimo', t: Date.now() });
  onDisconnect(presRef).remove();

  onValue(countRef, snap => {
    const n = snap.size || 0;
    onlineCount.textContent = n === 1 ? '1 persona en línea' : `${n} personas en línea`;
  });
} catch(e) {
  onlineCount.textContent = 'Chat en línea';
}

/* ── Escape HTML ── */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ── Arrancar ── */
iniciar();
</script>
